# Fly.io 배포 설정 — 기존 Dockerfile을 그대로 사용 (build context는 레포 루트)
# 배포 명령 (레포 루트에서 실행):
#   fly deploy --config services/jam-svc/fly.toml --dockerfile services/jam-svc/Dockerfile
# 3003(TCP, 내부 전용)은 Fly 프라이빗 네트워킹(jam-svc.internal:3003)으로 접근.
# 3004(HTTP/Socket.IO, 합주방 실시간 통신)는 외부에 공개해야 한다.
app = "tone-knob-jam-svc"
primary_region = "nrt"

[build]

[env]
  NODE_ENV = "production"
  JAM_SVC_PORT = "3003"
  JAM_SVC_HTTP_PORT = "3004"

[http_service]
  internal_port = 3004
  force_https = true
  auto_stop_machines = false # WebSocket 연결 유지를 위해 상시 실행
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
