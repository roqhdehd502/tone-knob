# Fly.io 배포 설정 — 기존 Dockerfile을 그대로 사용 (build context는 레포 루트)
# 배포 명령 (레포 루트에서 실행):
#   fly deploy --config services/auth-svc/fly.toml --dockerfile services/auth-svc/Dockerfile
# TCP 전용 마이크로서비스(공개 HTTP 없음) — 다른 서비스에서는 Fly 프라이빗 네트워킹
# (auth-svc.internal:3001, 6PN)으로 접근하므로 [[services]]/공개 포트가 필요 없다.
app = "tone-knob-auth-svc"
primary_region = "nrt"

[build]

[env]
  NODE_ENV = "production"
  AUTH_SVC_PORT = "3001"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
