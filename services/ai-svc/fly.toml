# Fly.io 배포 설정 — 기존 Dockerfile을 그대로 사용 (build context는 레포 루트)
# 배포 명령 (레포 루트에서 실행):
#   fly deploy --config services/ai-svc/fly.toml --dockerfile services/ai-svc/Dockerfile
# TCP 전용 마이크로서비스(공개 HTTP 없음) — Fly 프라이빗 네트워킹(ai-svc.internal:3009)으로 접근.
# ML_SERVER_URL이 설정/연결되지 않으면 더미 결과로 자동 대체 동작.
app = "tone-knob-ai-svc"
primary_region = "nrt"

[build]

[env]
  NODE_ENV = "production"
  AI_SVC_PORT = "3009"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
