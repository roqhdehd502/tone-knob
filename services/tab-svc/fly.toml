# Fly.io 배포 설정 — 기존 Dockerfile을 그대로 사용 (build context는 레포 루트)
# 배포 명령 (레포 루트에서 실행):
#   fly deploy --config services/tab-svc/fly.toml --dockerfile services/tab-svc/Dockerfile
# TCP 전용 마이크로서비스(공개 HTTP 없음) — Fly 프라이빗 네트워킹(tab-svc.internal:3002)으로 접근
app = "tone-knob-tab-svc"
primary_region = "nrt"

[build]

[env]
  NODE_ENV = "production"
  TAB_SVC_PORT = "3002"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
