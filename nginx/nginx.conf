# Tone Knob — Nginx 리버스 프록시 설정
# 교체 필요: YOUR_DOMAIN → 실제 도메인 (예: toneknob.app)
# SSL 인증서: certbot certonly --standalone -d YOUR_DOMAIN -d jam.YOUR_DOMAIN
#
# 트래픽 흐름:
#   클라이언트 → nginx:443
#     YOUR_DOMAIN      → gateway:3000  (REST API)
#     jam.YOUR_DOMAIN  → jam-svc:3004  (Socket.IO WebSocket)

events {
  worker_connections 1024;
}

http {
  # ── 공통 프록시 헤더 ─────────────────────────────────────────────────────────
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # ── SSL 공통 설정 ────────────────────────────────────────────────────────────
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # ── HTTP → HTTPS 리디렉트 ────────────────────────────────────────────────────
  server {
    listen 80;
    server_name YOUR_DOMAIN jam.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
  }

  # ── API Gateway (YOUR_DOMAIN) ────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # 요청 크기 제한 (악보 파일 업로드 고려)
    client_max_body_size 20M;

    location / {
      proxy_pass http://gateway:3000;
    }
  }

  # ── Jam Socket.IO (jam.YOUR_DOMAIN) ─────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name jam.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    location / {
      proxy_pass http://jam-svc:3004;

      # WebSocket 업그레이드 (Socket.IO 필수)
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";

      # WebSocket 연결 유지 (합주방 세션 동안)
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
    }
  }
}
