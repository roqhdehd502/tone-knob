# Fly.io 배포 설정 — 기존 Dockerfile을 그대로 사용 (build context는 레포 루트)
# 배포 명령 (레포 루트에서 실행):
#   fly deploy --config services/gateway/fly.toml --dockerfile services/gateway/Dockerfile
# 유일한 공개 HTTP 진입점 — 나머지 서비스는 Fly 프라이빗 네트워킹(<svc>.internal:<port>)으로 호출
app = "tone-knob-gateway"
primary_region = "nrt"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # 각 서비스의 Fly 프라이빗 네트워킹 주소로 교체
  AUTH_SVC_HOST = "tone-knob-auth-svc.internal"
  AUTH_SVC_PORT = "3001"
  TAB_SVC_HOST = "tone-knob-tab-svc.internal"
  TAB_SVC_PORT = "3002"
  JAM_SVC_HOST = "tone-knob-jam-svc.internal"
  JAM_SVC_PORT = "3003"
  COMMUNITY_SVC_HOST = "tone-knob-community-svc.internal"
  COMMUNITY_SVC_PORT = "3005"
  MARKETPLACE_SVC_HOST = "tone-knob-marketplace-svc.internal"
  MARKETPLACE_SVC_PORT = "3006"
  SUBSCRIPTION_SVC_HOST = "tone-knob-subscription-svc.internal"
  SUBSCRIPTION_SVC_PORT = "3007"
  MEDIA_SVC_HOST = "tone-knob-media-svc.internal"
  MEDIA_SVC_PORT = "3008"
  AI_SVC_HOST = "tone-knob-ai-svc.internal"
  AI_SVC_PORT = "3009"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
