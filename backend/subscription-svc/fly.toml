# Fly.io 배포 설정 — 기존 Dockerfile을 그대로 사용 (build context는 레포 루트)
# 배포 명령 (레포 루트에서 실행):
#   fly deploy --config services/subscription-svc/fly.toml --dockerfile services/subscription-svc/Dockerfile
# TCP 전용 마이크로서비스(공개 HTTP 없음) — Fly 프라이빗 네트워킹(subscription-svc.internal:3007)으로 접근
# 구독 만료 자동 처리(시간별 @Cron) 중복 실행 방지를 위해 머신 수를 1로 유지할 것
app = "tone-knob-subscription-svc"
primary_region = "nrt"

[build]

[env]
  NODE_ENV = "production"
  SUBSCRIPTION_SVC_PORT = "3007"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
