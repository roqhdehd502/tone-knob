# 서비스 간 디스커버리(호스트/포트)와 비민감 설정값. 값은 docker-compose.services.yml과 동일하게
# 각 서비스의 k8s Service 이름(ClusterIP)을 호스트로 사용한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tone-knob-config
  namespace: tone-knob
data:
  NODE_ENV: "production"

  AUTH_SVC_PORT: "3001"
  TAB_SVC_PORT: "3002"
  JAM_SVC_PORT: "3003"
  JAM_SVC_HTTP_PORT: "3004"
  COMMUNITY_SVC_PORT: "3005"
  MARKETPLACE_SVC_PORT: "3006"
  SUBSCRIPTION_SVC_PORT: "3007"
  MEDIA_SVC_PORT: "3008"
  AI_SVC_PORT: "3009"
  PORT: "3000"

  AUTH_SVC_HOST: auth-svc
  TAB_SVC_HOST: tab-svc
  JAM_SVC_HOST: jam-svc
  COMMUNITY_SVC_HOST: community-svc
  MARKETPLACE_SVC_HOST: marketplace-svc
  SUBSCRIPTION_SVC_HOST: subscription-svc
  MEDIA_SVC_HOST: media-svc
  AI_SVC_HOST: ai-svc

  REDIS_URL: redis://redis:6379
  GATEWAY_PUBLIC_URL: http://gateway:3000
  SUPABASE_STORAGE_BUCKET: media
  JWT_ACCESS_EXPIRATION: 15m
  JWT_REFRESH_EXPIRATION: 7d

  # 실제 ML 서버가 없으면 ai-svc는 더미 결과로 자동 대체 동작
  ML_SERVER_URL: http://ml-server:8001

  # 실제 배포 도메인으로 교체 필요
  FRONTEND_URL: https://your-frontend-domain.example
