# 플레이스홀더 시크릿 — 실제 값으로 교체 후 적용할 것.
# 프로덕션에서는 이 파일을 git에 커밋하지 말고 (.gitignore 또는 sealed-secrets/external-secrets 등 사용)
# `kubectl create secret generic tone-knob-secrets --from-literal=... -n tone-knob` 형태로 직접 생성하는 것을 권장한다.
apiVersion: v1
kind: Secret
metadata:
  name: tone-knob-secrets
  namespace: tone-knob
type: Opaque
stringData:
  # Supabase PostgreSQL 연결 문자열 (모든 서비스 공유 DB, 독립 커넥션 풀)
  DATABASE_URL: "postgresql://postgres:CHANGE_ME@CHANGE_ME.supabase.co:5432/postgres"
  # auth-svc에서 서명, gateway/jam-svc에서 검증 — 동일 값 필수 (openssl rand -hex 64 권장)
  JWT_SECRET: "CHANGE_ME"
  # Supabase Storage — media-svc 파일 업로드 (미설정 시 업로드 비활성)
  SUPABASE_URL: "https://CHANGE_ME.supabase.co"
  SUPABASE_SERVICE_ROLE_KEY: "CHANGE_ME"
  # ML 서버 ↔ Gateway 웹훅 인증 공유 시크릿 (선택, 미설정 시 검증 생략)
  ML_WEBHOOK_SECRET: "CHANGE_ME"
  # OAuth2 (선택, 미설정 시 비활성)
  GOOGLE_CLIENT_ID: "CHANGE_ME"
  GOOGLE_CLIENT_SECRET: "CHANGE_ME"
  GITHUB_CLIENT_ID: "CHANGE_ME"
  GITHUB_CLIENT_SECRET: "CHANGE_ME"
